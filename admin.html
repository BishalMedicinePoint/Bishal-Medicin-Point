<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | Bishal Medicine Point</title><link rel="stylesheet" href="style.css">
<style>
.admin-wrap{max-width:980px;margin:36px auto;padding:0 18px 50px}.admin-card{background:#fff;border:1px solid #e2e8e5;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 8px 28px rgba(20,60,40,.06)}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.admin-field{display:flex;flex-direction:column;gap:6px}.admin-field.full{grid-column:1/-1}.admin-field input,.admin-field select,.admin-field textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5d0;border-radius:9px;font:inherit}.admin-btn{border:0;border-radius:9px;padding:11px 17px;background:#087b50;color:white;font:inherit;cursor:pointer}.secondary{background:#53645c}.danger{background:#a83232}.admin-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.admin-status{padding:10px 12px;border-radius:8px;background:#eef7f1;margin:12px 0;white-space:pre-wrap}.admin-list{display:grid;gap:10px}.admin-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #e2e8e5;border-radius:10px}.admin-item img{width:54px;height:54px;object-fit:contain}.admin-item-info{flex:1;min-width:0}.admin-small{font-size:13px;color:#64736b}[hidden]{display:none!important}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.admin-field.full{grid-column:auto}.admin-item{flex-wrap:wrap}}
</style></head><body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-icon">+</span><span><strong>Bishal Medicine Point</strong><small>Admin Panel</small></span></a><a class="header-link" href="index.html">ওয়েবসাইট দেখুন</a></header>
<main class="admin-wrap">
<section id="loginPanel" class="admin-card"><h1>Admin Login</h1><p>শুধু অনুমোদিত Admin এখানে প্রবেশ করতে পারবেন।</p><form id="loginForm"><div class="admin-grid"><label class="admin-field full">ইমেইল<input id="email" type="email" autocomplete="username" required></label><label class="admin-field full">পাসওয়ার্ড<input id="password" type="password" autocomplete="current-password" required></label></div><div class="admin-actions"><button class="admin-btn" type="submit">Login</button></div></form><div id="loginStatus" class="admin-status" role="status"></div></section>
<section id="dashboard" hidden><div class="admin-card"><h1>Medicine Management</h1><p>নতুন পণ্য যোগ করো অথবা বিদ্যমান পণ্যের তথ্য পরিবর্তন করো।</p><div class="admin-actions"><button id="logoutBtn" class="admin-btn secondary" type="button">Logout</button><a class="admin-btn" href="index.html">ওয়েবসাইট দেখুন</a></div><div id="adminStatus" class="admin-status" role="status"></div></div>
<div class="admin-card"><h2 id="formTitle">নতুন ওষুধ যোগ করো</h2><form id="medicineForm"><input id="medicineId" type="hidden"><div class="admin-grid">
<label class="admin-field">ব্র্যান্ডের নাম *<input id="name" required maxlength="150"></label><label class="admin-field">জেনেরিক নাম<input id="generic_name" maxlength="180"></label>
<label class="admin-field">Strength<input id="strength" maxlength="80"></label><label class="admin-field">ধরন<select id="form"><option value="">নির্বাচন করো</option><option>Tablet</option><option>Capsule</option><option>Syrup</option><option>Suspension</option><option>Cream</option><option>Ointment</option><option>Gel</option><option>Drop</option><option>Injection</option><option>Other</option></select></label>
<label class="admin-field">কোম্পানি<input id="manufacturer" maxlength="150"></label><label class="admin-field">প্যাক সাইজ<input id="pack_size" maxlength="120"></label>
<label class="admin-field">একক মূল্য (৳)<input id="unit_price" type="number" min="0" step="0.01"></label><label class="admin-field">প্যাক মূল্য (৳)<input id="pack_price" type="number" min="0" step="0.01"></label>
<label class="admin-field full">ওষুধের ছবি<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="admin-field full">বর্তমান ছবির URL<input id="image_url" type="url" readonly></label><label class="admin-field full">অতিরিক্ত তথ্য<textarea id="description" rows="3" maxlength="500"></textarea></label>
</div><div class="admin-actions"><button class="admin-btn" type="submit">Save Medicine</button><button id="resetBtn" class="admin-btn secondary" type="button">নতুন ফর্ম</button></div></form></div>
<div class="admin-card"><h2>ওষুধের তালিকা</h2><div id="medicineAdminList" class="admin-list">তথ্য লোড হচ্ছে...</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
